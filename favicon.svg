<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Dark Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#0A0E17" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>

    <!-- Emerald Green Gradient for IC Monogram -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="50%" stop-color="#00C853" />
      <stop offset="100%" stop-color="#009246" />
    </linearGradient>

    <!-- Subtle Glass Border Gradient -->
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(0, 230, 118, 0.45)" />
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.08)" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Luxury Squircle Background -->
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bgGrad)" />
  <rect x="16" y="16" width="480" height="480" rx="120" fill="none" stroke="url(#borderGrad)" stroke-width="8" />

  <!-- Background Subtle Green Glow Accents -->
  <circle cx="256" cy="256" r="160" fill="url(#greenGrad)" opacity="0.12" filter="blur(40px)" />

  <!-- Geometric Luxury Monogram "IC" -->
  <g filter="url(#greenGlow)">
    <!-- Letter I -->
    <path d="M 130 140 L 180 140 C 188 140 194 146 194 154 L 194 358 C 194 366 188 372 180 372 L 130 372 C 122 372 116 366 116 358 L 116 154 C 116 146 122 140 130 140 Z" fill="url(#greenGrad)" />
    
    <!-- Letter I top/bottom accent dot or cut -->
    <rect x="136" y="160" width="38" height="192" rx="10" fill="#0A0E17" opacity="0.18" />

    <!-- Letter C -->
    <path d="M 370 156 C 352 143 328 136 302 136 C 240 136 190 186 190 256 C 190 326 240 376 302 376 C 328 376 352 369 370 356 C 378 350 380 340 375 332 L 354 300 C 349 292 338 291 330 297 C 322 303 312 306 302 306 C 274 306 252 284 252 256 C 252 228 274 206 302 206 C 312 206 322 209 330 215 C 338 221 349 220 354 212 L 375 180 C 380 172 378 162 370 156 Z" fill="url(#greenGrad)" />
  </g>

  <!-- Elegant Tricolor Accent Bar at Bottom of Shield/Squircle -->
  <g transform="translate(196, 412)">
    <rect x="0" y="0" width="36" height="6" rx="3" fill="#009246" />
    <rect x="42" y="0" width="36" height="6" rx="3" fill="#FFFFFF" opacity="0.9" />
    <rect x="84" y="0" width="36" height="6" rx="3" fill="#CE2B37" />
  </g>
</svg>
